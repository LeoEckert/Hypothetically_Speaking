<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hypothetically Speaking — Longevity AI Scientist</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px 16px; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #888; margin-top: 0; }
  textarea { width: 100%; box-sizing: border-box; min-height: 80px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #999; }
  button { margin-top: 10px; padding: 10px 18px; border-radius: 8px; border: none; background: #2b6cb0; color: white; font: inherit; cursor: pointer; }
  button:disabled { background: #aaa; cursor: default; }
  #trace { margin-top: 20px; border-left: 3px solid #2b6cb0; padding-left: 14px; }
  .event { margin-bottom: 8px; font-size: 0.9rem; }
  .event .tag { font-weight: 600; }
  .event.tool_call .tag { color: #b7791f; }
  .event.tool_result .tag { color: #2f855a; }
  .event.tool_result.mock .tag { color: #c53030; }
  .event.phase .tag { color: #6b46c1; }
  .event.error .tag { color: #c53030; }
  #report { margin-top: 24px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; white-space: pre-wrap; }
  #report h2 { font-size: 1.1rem; margin-top: 1.2em; }
  code { background: rgba(127,127,127,0.15); padding: 1px 4px; border-radius: 4px; }
  #status { font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Hypothetically Speaking</h1>
  <p class="sub">A Longevity AI Scientist — ask an ageing/longevity research question, watch it plan, retrieve, compute, and cite.</p>

  <textarea id="question" placeholder="e.g. Does SIRT1 activation plausibly extend human healthspan via mitochondrial biogenesis?"></textarea>
  <br />
  <button id="runBtn">Run</button>
  <span id="status"></span>

  <div id="trace"></div>
  <div id="report" hidden></div>

<script>
const runBtn = document.getElementById('runBtn');
const questionEl = document.getElementById('question');
const traceEl = document.getElementById('trace');
const reportEl = document.getElementById('report');
const statusEl = document.getElementById('status');

function addEvent(cls, tag, text) {
  const div = document.createElement('div');
  div.className = 'event ' + cls;
  div.innerHTML = `<span class="tag">${tag}</span> ${text}`;
  traceEl.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderReportMarkdown(md) {
  // Deliberately minimal, dependency-free renderer: headers, bullets, citation highlighting.
  const escaped = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const withCitations = escaped.replace(/\[([A-Za-z0-9_:.\-]+)\]/g, '<code>[$1]</code>');
  const lines = withCitations.split('\n').map(line => {
    if (line.startsWith('## ')) return `<h2>${line.slice(3)}</h2>`;
    if (line.startsWith('- ')) return `<div>&bull; ${line.slice(2)}</div>`;
    return line;
  });
  return lines.join('\n');
}

runBtn.addEventListener('click', async () => {
  const question = questionEl.value.trim();
  if (!question) return;
  runBtn.disabled = true;
  traceEl.innerHTML = '';
  reportEl.hidden = true;
  statusEl.textContent = 'starting…';

  const startResp = await fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  const { run_id } = await startResp.json();
  statusEl.textContent = `run ${run_id} in progress…`;

  const es = new EventSource(`/api/run/${run_id}/stream`);
  es.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    switch (event.type) {
      case 'start':
        addEvent('start', 'START', `run ${event.run_id}`);
        break;
      case 'phase':
        addEvent('phase', 'PHASE', event.phase);
        break;
      case 'assistant_text':
        addEvent('assistant_text', 'REASONING', event.text.slice(0, 400));
        break;
      case 'tool_call':
        addEvent('tool_call', 'CALL', `${event.tool}(${JSON.stringify(event.args)})`);
        break;
      case 'tool_result': {
        const mockTag = event.mock ? ' [MOCK/FALLBACK]' : '';
        addEvent('tool_result' + (event.mock ? ' mock' : ''), 'RESULT', `${event.tool}${mockTag}: ${event.summary.slice(0, 300)}`);
        break;
      }
      case 'error':
        addEvent('error', 'ERROR', event.error);
        break;
      case 'done':
        reportEl.hidden = false;
        reportEl.innerHTML = renderReportMarkdown(event.report);
        statusEl.textContent = event.partial ? 'done (partial run — budget limit reached)' : 'done';
        break;
      case 'stream_end':
        es.close();
        runBtn.disabled = false;
        break;
    }
  };
  es.onerror = () => {
    statusEl.textContent = 'connection lost';
    es.close();
    runBtn.disabled = false;
  };
});
</script>
</body>
</html>
