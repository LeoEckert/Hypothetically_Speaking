name: TEMP - rotate Vercel token

# One-off, manually-triggered only. Creates a new Vercel token scoped to
# just this project (instead of the current full-account VERCEL_TOKEN) and
# lists existing tokens so the old one can be identified and revoked
# afterward. Deleted once the rotation is done — not part of the normal
# deploy pipeline.
on:
  workflow_dispatch: {}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: List existing tokens (to find the current one's id/name)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: vercel tokens ls --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Create a new project-scoped token
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          vercel tokens add "github-actions-deploy-scoped" --project "${{ secrets.VERCEL_PROJECT_ID }}" --token="${{ secrets.VERCEL_TOKEN }}"
