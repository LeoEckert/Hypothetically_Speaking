name: CI

# Runs on every pull request (into dev, main, or anywhere else) — this is
# the required status check behind main's branch protection ruleset (see
# CLAUDE.md's Branching & workflow section and docs/DEPLOY.md). Mirrors the
# exact commands in CLAUDE.md's Commands section, just automated instead of
# run manually before a commit.
on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run lint
