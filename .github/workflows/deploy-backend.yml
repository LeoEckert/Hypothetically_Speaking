name: Deploy backend to Nebius VM

# Frontend deploys automatically via Vercel's git integration (no workflow
# needed here). This workflow only handles the backend, which lives on a
# plain VM with no platform-native CI/CD of its own.
on:
  push:
    branches: [claude/gracious-curie-lkjlq1]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NEBIUS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.NEBIUS_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to VM
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='frontend/node_modules' --exclude='frontend/dist' \
            --exclude='backend/reports/*.json' --exclude='backend/reports/*.md' \
            --exclude='.env' --exclude='.pytest_cache' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ ubuntu@${{ secrets.NEBIUS_VM_HOST }}:/opt/app/repo/

      - name: Rebuild and restart the backend container
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.NEBIUS_VM_HOST }} \
            'cd /opt/app/repo && sudo docker compose up -d --build app'
