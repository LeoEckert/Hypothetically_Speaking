name: Deploy backend to Vercel (serverless)

# A dedicated, backend-only Vercel project — deliberately NOT the same
# project as the frontend (see docs/DEPLOY.md and CLAUDE.md): co-locating
# the Python FastAPI backend with the frontend's Vite framework preset in
# one project never got the function invoked at all (100% 404, zero runtime
# logs, across three different configurations). A clean, dedicated project
# fixed that — but then hit a second, unrelated problem: this Vercel
# account's native FastAPI/ASGI auto-detection is itself broken (confirmed
# by elimination: a bare, dependency-free `app = FastAPI()` still
# FUNCTION_INVOCATION_FAILED on every request, while a legacy WSGI-style
# `BaseHTTPRequestHandler` function worked immediately). The fix: bridge the
# real FastAPI app through a2wsgi's ASGIMiddleware onto that working WSGI
# pathway (api/index.py below) instead of exposing it as a bare ASGI `app`.
#
# Deploys via the Vercel CLI with a token (same pattern as
# deploy-frontend.yml, for the same reason: native git integration is
# fragile on this account's Hobby plan). The staged directory keeps
# backend/ nested under api/'s sibling (not flattened) because the codebase
# uses absolute `from backend.xxx import ...` imports throughout —
# flattening would break every one of them.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage a clean backend-only deploy root
        run: |
          mkdir -p /tmp/backend-deploy/api
          cp -r backend /tmp/backend-deploy/backend
          grep -v '^pytest' requirements.txt > /tmp/backend-deploy/requirements.txt
          cat > /tmp/backend-deploy/api/index.py <<'EOF'
          from a2wsgi import ASGIMiddleware

          from backend.server.app import app as _asgi_app

          app = ASGIMiddleware(_asgi_app)
          EOF
          cat > /tmp/backend-deploy/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "functions": {
              "api/index.py": { "maxDuration": 300 }
            }
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        working-directory: /tmp/backend-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
