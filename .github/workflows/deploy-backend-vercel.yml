name: Deploy backend to Vercel (serverless)

# A dedicated, backend-only Vercel project — deliberately NOT the same
# project as the frontend (see docs/DEPLOY.md and CLAUDE.md's Open TODOs):
# co-locating the Python FastAPI backend with the frontend's Vite framework
# preset in one project hit unresolved routing issues (the function was
# never invoked for any request). A clean, dedicated project gives Vercel's
# native FastAPI auto-detection (frontend/pyproject.toml's sibling here,
# backend/pyproject.toml) nothing to conflict with.
#
# Deploys via the Vercel CLI with a token (same pattern as
# deploy-frontend.yml, for the same reason: native git integration is
# fragile on this account's Hobby plan). The staged directory keeps
# backend/ nested under the deploy root (not flattened) because the
# codebase uses absolute `from backend.xxx import ...` imports throughout —
# flattening would break every one of them.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage a clean backend-only deploy root
        run: |
          mkdir -p /tmp/backend-deploy
          cp -r backend /tmp/backend-deploy/backend
          grep -v '^pytest' requirements.txt > /tmp/backend-deploy/requirements.txt
          cat > /tmp/backend-deploy/pyproject.toml <<'EOF'
          [project]
          name = "hypothetically-speaking-backend"
          version = "0.1.0"
          requires-python = "==3.12.*"
          dependencies = []

          [tool.vercel]
          entrypoint = "_diag:app"
          EOF
          # Temporary diagnostic entrypoint (see CLAUDE.md's Open TODOs):
          # the real app has crashed at import time on every deploy so far
          # with FUNCTION_INVOCATION_FAILED and no retrievable traceback
          # (`vercel logs` consistently reports none, even moments after a
          # confirmed invocation) — this wraps the real import in a
          # try/except and serves the traceback as the HTTP response
          # instead, so the actual exception is visible via a plain curl.
          # Point [tool.vercel].entrypoint back at "backend.server.app:app"
          # directly once the underlying crash is fixed.
          cat > /tmp/backend-deploy/_diag.py <<'EOF'
          import traceback

          try:
              from backend.server.app import app  # noqa: F401
          except Exception:
              _tb = traceback.format_exc()
              from fastapi import FastAPI
              from fastapi.responses import PlainTextResponse

              app = FastAPI()

              @app.get("/{path:path}")
              def _err(path: str):
                  return PlainTextResponse(_tb, status_code=500)
          EOF
          cat > /tmp/backend-deploy/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "name": "hypothetically-speaking-backend",
            "functions": {
              "_diag.py": { "maxDuration": 300 }
            }
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # First-ever run of this workflow has no VERCEL_BACKEND_PROJECT_ID secret
      # yet, so VERCEL_PROJECT_ID is left unset (not passed as an empty
      # string, which the CLI could treat as an invalid id) — `vercel deploy
      # --yes` then creates the project fresh (named per vercel.json's
      # "name") under the token's default team. Once the printed project ID
      # is known, a VERCEL_BACKEND_PROJECT_ID secret should be added so
      # every later run targets the same project explicitly.
      - name: Deploy to Vercel (production)
        id: deploy
        working-directory: /tmp/backend-deploy
        run: |
          # The CLI errors if only one of VERCEL_ORG_ID/VERCEL_PROJECT_ID is
          # set ("you need to specify both") — so both are only exported
          # once VERCEL_BACKEND_PROJECT_ID exists (i.e. after the first,
          # bootstrap run below has created the project).
          if [ -n "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" ]; then
            export VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID }}"
            export VERCEL_PROJECT_ID="${{ secrets.VERCEL_BACKEND_PROJECT_ID }}"
          fi
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "--- linked project ---"
          cat .vercel/project.json || true

      # Temporary while bringing this up (see CLAUDE.md's Open TODOs) — hits
      # the stable production alias (the per-deployment url output redirects
      # to a Vercel Authentication gate) and prints _diag.py's response,
      # which is the real Python traceback if the actual app failed to import.
      - name: Smoke test
        if: always()
        run: |
          sleep 3
          curl -s -w "\nHTTP:%{http_code}\n" "https://hypothetically-speaking-backend.vercel.app/api/config" || true
