name: Deploy frontend + backend to Vercel

# Vercel's native git integration is intentionally disconnected for this
# project (see docs/DEPLOY.md) to work around a Hobby-plan limitation: any
# push by a non-owner GitHub identity makes the linked GitHub App file a
# "request to join the team", which Hobby cannot resolve and which blocks
# ALL deploys until resolved. This workflow deploys via the Vercel CLI with
# a personal access token instead — that path checks the token's own
# permissions on the project, not the pushing GitHub identity, so it isn't
# subject to that restriction.
#
# This project's Root Directory is "frontend" (set in the Vercel dashboard),
# so a Python serverless function has to live inside frontend/ to be
# auto-detected alongside the static build. The backend code itself stays at
# the repo root (same layout as local dev, tests, scripts/run_demo.py) — the
# "Stage backend for the Vercel function" step below copies it into
# frontend/api/backend/ (nested *under* the function's own directory, not
# beside it — Vercel's Python builder bundles a function's own directory
# tree, not a sibling reached only via a runtime sys.path append) right
# before deploy, rather than duplicating it permanently in the repo.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage backend for the Vercel function
        run: |
          cp -r backend frontend/api/backend
          grep -v '^pytest' requirements.txt > frontend/requirements.txt

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Temporary diagnostic while bringing up the Python function on Vercel
      # (see CLAUDE.md's Open TODOs) — safe to remove once /api/config is
      # confirmed working from a normal deploy. Hitting the production alias,
      # not steps.deploy.outputs.url: the raw per-deployment URL redirects to
      # a Vercel Authentication gate (deployment protection), the alias
      # doesn't. `vercel inspect --logs` only shows build logs; `vercel logs`
      # is the runtime/request-log command.
      - name: Show function invocation logs
        if: always()
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          (timeout 25 vercel logs "${{ steps.deploy.outputs.url }}" --token=${{ secrets.VERCEL_TOKEN }} > vercel-logs.txt 2>&1 &)
          sleep 5
          curl -s -w "\nHTTP:%{http_code}\n" "https://frontend-azure-two-37.vercel.app/api/config" || true
          sleep 15
          echo "---runtime logs---"
          cat vercel-logs.txt || true
