name: Deploy to Vercel

# Vercel's native git integration is intentionally disconnected for this
# project (see docs/DEPLOY.md) to work around a Hobby-plan limitation: any
# push by a non-owner GitHub identity makes the linked GitHub App file a
# "request to join the team", which Hobby cannot resolve and which blocks
# ALL deploys until resolved. This workflow deploys via the Vercel CLI with
# a personal access token instead — that path checks the token's own
# permissions on the project, not the pushing GitHub identity, so it isn't
# subject to that restriction.
#
# One Vercel project serves both: the static Vite build and a Python
# serverless function for the backend. This project's Root Directory is
# "frontend" (set in the Vercel dashboard), so the function has to live at
# frontend/api/[...path].py to be auto-detected alongside the static build,
# and backend/ must be staged as that function file's *sibling* —
# frontend/backend/, not nested inside frontend/api/ — matching the exact
# layout confirmed working during development (nesting it under api/
# instead produces `ModuleNotFoundError: No module named 'backend'` at
# runtime; Vercel's Python function root ends up being the deploy root, not
# api/'s own directory). backend/ itself stays at the repo root otherwise
# (same layout as local dev, tests, scripts/run_demo.py) — the staging step
# below copies it into frontend/backend/ right before deploy rather than
# duplicating it permanently in the repo.
#
# The function bridges the real FastAPI app through a2wsgi's ASGIMiddleware
# onto Vercel's WSGI pathway rather than exposing bare ASGI — this account's
# native FastAPI/ASGI auto-detection is broken (confirmed by elimination;
# see docs/DEPLOY.md), and this WSGI bridge is what actually gets invoked
# correctly.
#
# Routing — KNOWN LIMITATION, unresolved: a plain api/index.py only
# auto-maps to the literal /api path, not the whole /api/* prefix. The
# catch-all filename convention used here (api/[...path].py) only matches a
# SINGLE path segment on this account/project (confirmed live: /api/config,
# /api/tools, /api/run all work; /api/run/<id>/evaluate, /api/admin/usage,
# PUT /api/tools/<name> all 404 at the platform level — this is exactly why
# "Evaluate with AI" broke). A vercel.json `rewrites` entry
# (/api/:path* -> /api) was tried twice, in two different sessions, and
# BOTH times broke the app worse — the second time it 404'd even the
# single-segment paths that were previously working. Do not re-attempt that
# exact rewrite without first confirming in a preview/throwaway deploy that
# it doesn't regress the working single-segment routes. See docs/DEPLOY.md
# for the full history — this needs a real fix (candidates: multiple fixed-
# depth catch-all files, checking for a dashboard-level routing override
# from earlier manual experiments, or asking Vercel support) before any
# multi-segment /api/* route can be trusted in production.
# Two branches, two URLs, one Vercel project (no reason for a second project
# — see docs/DEPLOY.md's "get rid of this two vercel project bullshit"
# history): `main` deploys as the real Production deployment (the stable
# hypothetically-speaking.vercel.app alias); `dev` deploys as a Preview
# deployment that then gets a *stable* alias of its own
# (hypothetically-speaking-dev.vercel.app) via `vercel alias set` — a plain
# preview deploy's own auto-generated URL is a fresh, unpredictable hash
# every time, which isn't useful as "the dev URL" to bookmark/share.
on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub-native deployment tracking (repo -> Environments): which branch
    # deployed where, and when, with a clickable link — this is purely
    # cosmetic/tracking, it doesn't gate anything (branch protection on main
    # is the actual gate, see CLAUDE.md's Branching & workflow section).
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev-preview' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://hypothetically-speaking.vercel.app' || 'https://hypothetically-speaking-dev.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage backend for the Vercel function
        run: |
          mkdir -p frontend/api
          cp -r backend frontend/backend
          grep -v '^pytest' requirements.txt > frontend/requirements.txt
          cat > "frontend/api/[...path].py" <<'EOF'
          from a2wsgi import ASGIMiddleware

          from backend.server.app import app as _asgi_app

          app = ASGIMiddleware(_asgi_app)
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Deploy to Vercel (dev preview) and alias it
        if: github.ref == 'refs/heads/dev'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Vercel's default "Vercel Authentication" project setting SSO-gates
          # every Preview deployment (production is unaffected/never was
          # gated) — a custom alias on a preview deployment inherits that
          # gate too, so the dev URL would just redirect to vercel.com/sso-api
          # for anyone without a login on this Vercel team. Idempotent to
          # repeat every deploy, so it self-heals if the dashboard setting
          # ever gets flipped back on.
          vercel project protection disable --sso --token="${{ secrets.VERCEL_TOKEN }}" || echo "::warning::protection-disable failed, continuing to test deploy+alias in isolation"

          DEPLOY_URL=$(vercel deploy --token="${{ secrets.VERCEL_TOKEN }}" --yes)
          echo "Preview deployment: $DEPLOY_URL"
          vercel alias set "$DEPLOY_URL" hypothetically-speaking-dev.vercel.app --token="${{ secrets.VERCEL_TOKEN }}"
